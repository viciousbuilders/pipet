<!doctype html><html><head><meta charset="utf-8"><title>Pipet web insertion check</title></head><body>
<h1>Pipet web insertion check</h1>
<p>Click the editor, then run the signed Pipet web check. No microphone or network transcription is used.</p>
<div id="editor" role="textbox" aria-label="Pipet web check editor" contenteditable="true" style="min-height:100px;border:2px solid #555;padding:20px">Pipet web check</div>
<p>Input events: <output id="events">0</output></p>
<script>window.inputCount=0;editor.addEventListener('input',()=>events.textContent=++window.inputCount)</script>
</body></html>
